name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache bundled tools
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/python
            src-tauri/binaries
          key: ${{ runner.os }}-${{ runner.arch }}-bundled-tools-${{ hashFiles('package-lock.json', 'scripts/bundle-python.*', 'scripts/download-ffmpeg.*') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bundled-tools-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Bundle Python
        run: npm run bundle-python

      - name: Bundle ffmpeg
        run: npm run bundle-ffmpeg

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
